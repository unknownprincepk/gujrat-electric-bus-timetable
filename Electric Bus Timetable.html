            currentScheduleType = type;
            const btnW = document.getElementById('btnWeekday');
            const btnS = document.getElementById('btnSunday');

                btnW.className = "flex-1 py-2 rounded-lg text-center transition-all bg-emerald-600 text-white shadow-sm font-bold";

            populateStartStops();

        function autoDetectDay() {
            const day = new Date().getDay();
            if (day === 0) {
                setScheduleType('sunday');
            } else {
                setScheduleType('weekday');
            }
        }

        function initStopsData() {
            allStopsMap = [];
            const activeLines = SCHEDULES[currentScheduleType];
            Object.keys(activeLines).forEach(lineKey => {
                const line = activeLines[lineKey];
                line.stops.forEach((s, idx) => {
                    allStopsMap.push({
                        id: `${lineKey}_${idx}`,
                        name: s.name,
                        lineKey: lineKey,
                        stopIdx: idx
                    });
                });
            });

            // Alphabetical Sorting
            allStopsMap.sort((a, b) => a.name.localeCompare(b.name));
        }

        function populateStartStops() {
            const startSelect = document.getElementById('startStop');
            const prevVal = startSelect.value;
            startSelect.innerHTML = '';
            const activeLines = SCHEDULES[currentScheduleType];

            allStopsMap.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.textContent = `${item.name} (${activeLines[item.lineKey].name.split(' ⇆ ')[0]})`;
                startSelect.appendChild(opt);
            });

            if (prevVal && [...startSelect.options].some(o => o.value === prevVal)) {
                startSelect.value = prevVal;
            }
        }

        function updateDestinations() {
            const startVal = document.getElementById('startStop').value;
            const endSelect = document.getElementById('endStop');
            const prevVal = endSelect.value;
            endSelect.innerHTML = '';

            if (!startVal) return;

            const [startLineKey, startIdxStr] = startVal.split('_');
            const startIdx = parseInt(startIdxStr);

            let destinationList = allStopsMap.filter(item => item.id !== startVal);

            destinationList.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.id;

                if (item.lineKey === startLineKey) {
                    const direction = item.stopIdx > startIdx ? "Direct Down" : "Direct Up";
                    opt.textContent = `${item.name} (${direction})`;
                } else {
                    opt.textContent = `${item.name} (via GBS Gujrat Hub Transfer)`;
                }
                endSelect.appendChild(opt);
            });

            if (prevVal && [...endSelect.options].some(o => o.value === prevVal)) {
                endSelect.value = prevVal;
            }
        }

        function parseTime(timeStr) {
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (modifier === 'PM' && hours < 12) hours += 12;
            if (modifier === 'AM' && hours === 12) hours = 0;
            const d = new Date();
            d.setHours(hours, minutes, 0, 0);
            return d;
        }

        function formatTime(dateObj) {
            let hours = dateObj.getHours();
            let minutes = dateObj.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return `${hours}:${minutes} ${ampm}`;
        }

        function formatDuration(diffMins) {
            if (diffMins < 0) return "Passed";
            const hrs = Math.floor(diffMins / 60);
            const mins = Math.round(diffMins % 60);
            if (hrs > 0) {
                return `${hrs} Ghanta ${mins} Mins`;
            }
            return `${mins} Mins`;
        }

        function getCurrentTime() {
            if (document.getElementById('customTimeToggle').checked) {
                const customVal = document.getElementById('customTime').value;
                if (customVal) {
                    const [h, m] = customVal.split(':').map(Number);
                    const d = new Date();
                    d.setHours(h, m, 0, 0);
                    return d;
                }
            }
            return new Date();
        }

        function toggleTimeInput() {
            const customInput = document.getElementById('customTime');
            const toggle = document.getElementById('customTimeToggle');
            if (toggle.checked) {
                customInput.classList.remove('hidden');
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                customInput.value = `${hh}:${mm}`;
            } else {
                customInput.classList.add('hidden');
            }
            calculateRoute();
        }

        function calculateSingleLineTimings(lineKey, startIdx, endIdx, referenceTime) {
            const line = SCHEDULES[currentScheduleType][lineKey];
            const isDown = startIdx <= endIdx;
            const stopsCount = line.stops.length;

            const departureOffset = isDown ? line.stops[startIdx].min : (line.stops[stopsCount - 1].min - line.stops[startIdx].min);
            const arrivalOffset = isDown ? line.stops[endIdx].min : (line.stops[stopsCount - 1].min - line.stops[endIdx].min);
            const travelDuration = Math.abs(arrivalOffset - departureOffset);

            let nextTrip = null;
            let minWaitMins = Infinity;
            let passedBuses = [];
            let upcomingBuses = [];

            line.startTimes.forEach((st, tIdx) => {
                const tripStart = parseTime(st);
                const busAtStartStop = new Date(tripStart.getTime() + departureOffset * 60000);
                const busAtEndStop = new Date(tripStart.getTime() + arrivalOffset * 60000);

                const diffMins = (busAtStartStop - referenceTime) / 60000;

                const busInfo = {
                    tripNum: tIdx + 1,
                    departure: busAtStartStop,
                    arrival: busAtEndStop,
                    diffMins: diffMins
                };

                if (diffMins >= 0) {
                    upcomingBuses.push(busInfo);
                    if (diffMins < minWaitMins) {
                        minWaitMins = diffMins;
                        nextTrip = busInfo;
                    }
                } else {
                    passedBuses.push(busInfo);
                }
            });

            const lastTrip = line.startTimes.length > 0 ? {
                tripNum: line.startTimes.length,
                departure: new Date(parseTime(line.startTimes[line.startTimes.length - 1]).getTime() + departureOffset * 60000),
                arrival: new Date(parseTime(line.startTimes[line.startTimes.length - 1]).getTime() + arrivalOffset * 60000)
            } : null;

            return { nextTrip, travelDuration, upcomingBuses, passedBuses, lastTrip };
        }

        function calculateRoute() {
            const startVal = document.getElementById('startStop').value;
            const endVal = document.getElementById('endStop').value;
            const resultCard = document.getElementById('resultCard');

            if (!startVal || !endVal) return;

            const [startLineKey, startIdxStr] = startVal.split('_');
            const [endLineKey, endIdxStr] = endVal.split('_');
            const startIdx = parseInt(startIdxStr);
            const endIdx = parseInt(endIdxStr);

            const refTime = getCurrentTime();
            const activeLines = SCHEDULES[currentScheduleType];

            // Direct Route
            if (startLineKey === endLineKey) {
                const res = calculateSingleLineTimings(startLineKey, startIdx, endIdx, refTime);
                renderDirectResult(res, activeLines[startLineKey].stops[startIdx].name, activeLines[startLineKey].stops[endIdx].name);
                renderScheduleLists(res.upcomingBuses, res.passedBuses);
            } else {
                // Connecting Route via GBS Gujrat Hub
                const startLine = activeLines[startLineKey];
                const gbsIdxLeg1 = startLine.stops.findIndex(s => s.name.includes("GBS Gujrat"));
                const leg1 = calculateSingleLineTimings(startLineKey, startIdx, gbsIdxLeg1, refTime);

                if (!leg1.nextTrip) {
                    resultCard.innerHTML = `<div class="text-center text-rose-600 font-bold py-4"><i class="fa-solid fa-circle-exclamation mr-1"></i> Boarding stop se GBS Gujrat Hub ke liye aaj mazeed koi bus nahi hai.</div>`;
                    renderScheduleLists([], leg1.passedBuses);
                    return;
                }

                const endLine = activeLines[endLineKey];
                const gbsIdxLeg2 = endLine.stops.findIndex(s => s.name.includes("GBS Gujrat"));
                const leg1ArrivalAtHub = leg1.nextTrip.arrival;
                
                const leg2 = calculateSingleLineTimings(endLineKey, gbsIdxLeg2, endIdx, leg1ArrivalAtHub);

                renderConnectingResult(leg1, leg2, startLine.stops[startIdx].name, endLine.stops[endIdx].name);
                renderScheduleLists(leg1.upcomingBuses, leg1.passedBuses);
            }
        }

        function renderDirectResult(res, startName, endName) {
            const resultCard = document.getElementById('resultCard');

            if (!res.nextTrip) {
                resultCard.innerHTML = `<div class="text-center text-rose-600 font-bold py-4"><i class="fa-solid fa-circle-exclamation mr-1"></i> Is schedule par aaj ke din mazeed koi bus nahi hai.</div>`;
                return;
            }

            const waitStr = formatDuration(res.nextTrip.diffMins);

            resultCard.innerHTML = `
                <div class="flex items-center justify-between mb-3 border-b border-gray-200 pb-2">
                    <span class="text-xs font-bold text-emerald-700 uppercase tracking-wide">Direct Route (${currentScheduleType === 'weekday' ? 'Mon-Sat' : 'Sunday'})</span>
                    <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">
                        Next Bus: ${waitStr} baqi
                    </span>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                        <p class="text-xs text-gray-400 font-medium">Boarding Departure</p>
                        <p class="text-lg font-extrabold text-gray-900 mt-0.5">${formatTime(res.nextTrip.departure)}</p>
                        <p class="text-xs text-emerald-600 font-semibold truncate mt-1">${startName}</p>
                    </div>
                    <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                        <p class="text-xs text-gray-400 font-medium">Destination Arrival</p>
                        <p class="text-lg font-extrabold text-gray-900 mt-0.5">${formatTime(res.nextTrip.arrival)}</p>
                        <p class="text-xs text-rose-500 font-semibold truncate mt-1">${endName}</p>
                    </div>
                </div>

                <div class="bg-emerald-50 rounded-xl p-3 flex items-center justify-between text-xs text-emerald-900">
                    <span><i class="fa-solid fa-clock mr-1 text-emerald-600"></i> Total Travel Duration:</span>
                    <span class="font-bold">${res.travelDuration} Minutes</span>
                </div>
            `;
        }

        function renderConnectingResult(leg1, leg2, startName, endName) {
            const resultCard = document.getElementById('resultCard');

            const leg1WaitStr = formatDuration(leg1.nextTrip.diffMins);

            // Case when connecting Leg 2 bus is NOT available after Leg 1 arrival
            if (!leg2.nextTrip) {
                const lastLeg2DepartureTime = leg2.lastTrip ? formatTime(leg2.lastTrip.departure) : "N/A";

                resultCard.innerHTML = `
                    <div class="flex items-center justify-between mb-3 border-b border-gray-200 pb-2">
                        <span class="text-xs font-bold text-amber-600 uppercase tracking-wide">
                            <i class="fa-solid fa-triangle-exclamation mr-1"></i> Partial Route Available
                        </span>
                        <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">
                            1st Bus: ${leg1WaitStr} baqi
                        </span>
                    </div>

                    <!-- Leg 1 Display -->
                    <div class="bg-white p-3 rounded-xl border border-gray-200 mb-3 shadow-sm">
                        <div class="flex justify-between text-xs text-gray-500 font-bold mb-1">
                            <span>BUS 1 (${startName} ➔ GBS Gujrat)</span>
                            <span>Trip #${leg1.nextTrip.tripNum}</span>
                        </div>
                        <div class="flex justify-between items-center text-sm font-extrabold text-gray-900">
                            <div>
                                <span>${formatTime(leg1.nextTrip.departure)}</span>
                                <span class="block text-xs font-normal text-emerald-600">${startName}</span>
                            </div>
                            <i class="fa-solid fa-arrow-right text-gray-300 text-xs"></i>
                            <div class="text-right">
                                <span>${formatTime(leg1.nextTrip.arrival)}</span>
                                <span class="block text-xs font-normal text-gray-500">GBS Gujrat Hub</span>
                            </div>
                        </div>
                    </div>

                    <!-- Warning for Missing Leg 2 -->
                    <div class="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800 font-medium">
                        <p class="font-bold mb-1"><i class="fa-solid fa-circle-xmark text-rose-600 mr-1"></i> Aage connecting bus available nahi hai!</p>
                        GBS Gujrat Hub se <strong>${endName}</strong> ke liye aakhri bus <strong>${lastLeg2DepartureTime}</strong> par ja chuki thi, is liye is waqt aage mazeed koi bus available nahi hai.
                    </div>
                `;
                return;
            }

            const transferWaitMins = (leg2.nextTrip.departure - leg1.nextTrip.arrival) / 60000;
            const transferWaitStr = formatDuration(transferWaitMins);

            resultCard.innerHTML = `
                <div class="flex items-center justify-between mb-3 border-b border-gray-200 pb-2">
                    <span class="text-xs font-bold text-amber-600 uppercase tracking-wide">
                        <i class="fa-solid fa-code-merge mr-1"></i> Transfer Route (${currentScheduleType === 'weekday' ? 'Mon-Sat' : 'Sunday'})
                    </span>
                    <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">
                        1st Bus: ${leg1WaitStr} baqi
                    </span>
                </div>

                <!-- Leg 1 Card -->
                <div class="bg-white p-3 rounded-xl border border-gray-200 mb-3 shadow-sm">
                    <div class="flex justify-between text-xs text-gray-500 font-bold mb-1">
                        <span>BUS 1 (Boarding to Hub)</span>
                        <span>Trip #${leg1.nextTrip.tripNum}</span>
                    </div>
                    <div class="flex justify-between items-center text-sm font-extrabold text-gray-900">
                        <div>
                            <span>${formatTime(leg1.nextTrip.departure)}</span>
                            <span class="block text-xs font-normal text-emerald-600">${startName}</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-gray-300 text-xs"></i>
                        <div class="text-right">
                            <span>${formatTime(leg1.nextTrip.arrival)}</span>
                            <span class="block text-xs font-normal text-gray-500">GBS Gujrat Hub</span>
                        </div>
                    </div>
                </div>

                <!-- Transfer Station Wait -->
                <div class="my-2 p-2 bg-amber-50 border border-amber-200 rounded-xl text-center text-xs text-amber-800 font-medium">
                    <i class="fa-solid fa-clock-rotate-left mr-1 text-amber-600"></i> GBS Gujrat Station Transfer Wait: <strong>${transferWaitStr}</strong>
                </div>

                <!-- Leg 2 Card -->
                <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm mt-3">
                    <div class="flex justify-between text-xs text-gray-500 font-bold mb-1">
                        <span>BUS 2 (Hub to Final Destination)</span>
                        <span>Trip #${leg2.nextTrip.tripNum}</span>
                    </div>
                    <div class="flex justify-between items-center text-sm font-extrabold text-gray-900">
                        <div>
                            <span>${formatTime(leg2.nextTrip.departure)}</span>
                            <span class="block text-xs font-normal text-gray-500">GBS Gujrat Hub</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-gray-300 text-xs"></i>
                        <div class="text-right">
                            <span>${formatTime(leg2.nextTrip.arrival)}</span>
                            <span class="block text-xs font-normal text-rose-500">${endName}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderScheduleLists(upcoming, passed) {
            const upContainer = document.getElementById('upcomingBuses');
            const passContainer = document.getElementById('passedBuses');

            upContainer.innerHTML = '';
            passContainer.innerHTML = '';

            if (upcoming.length === 0) {
                upContainer.innerHTML = `<p class="text-xs text-gray-400 italic">Aaj koi agli bus baqi nahi hai.</p>`;
            } else {
                upcoming.forEach((b, idx) => {
                    const isFirst = idx === 0;
                    const durationText = formatDuration(b.diffMins);

                    const div = document.createElement('div');
                    div.className = `p-2.5 rounded-xl border flex items-center justify-between text-xs ${
                        isFirst ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-bold' : 'bg-gray-50 border-gray-200 text-gray-700'
                    }`;

                    div.innerHTML = `
                        <div class="flex items-center">
                            <span class="w-6 h-6 rounded-full ${isFirst ? 'bg-emerald-600 text-white' : 'bg-gray-200 text-gray-600'} flex items-center justify-center text-[10px] mr-2">
                                #${b.tripNum}
                            </span>
                            <span>Departure: <strong>${formatTime(b.departure)}</strong></span>
                        </div>
                        <span class="${isFirst ? 'text-emerald-700 font-extrabold' : 'text-gray-500'}">
                            ${durationText} baqi
                        </span>
                    `;
                    upContainer.appendChild(div);
                });
            }

            if (passed.length === 0) {
                passContainer.innerHTML = `<p class="text-xs text-gray-400 italic">Abhi koi bus nahi guzri.</p>`;
            } else {
                passed.slice(-3).reverse().forEach(b => {
                    const div = document.createElement('div');
                    div.className = 'p-2 rounded-lg bg-gray-50 border border-gray-100 flex items-center justify-between text-xs text-gray-400 line-through';
                    div.innerHTML = `
                        <span>Trip #${b.tripNum} - ${formatTime(b.departure)}</span>
                        <span>Guzar Chuki</span>
                    `;
                    passContainer.appendChild(div);
                });
            }
        }

        // Initialize Application
        window.onload = function() {
            autoDetectDay();
            initStopsData();
            populateStartStops();
            updateDestinations();
            calculateRoute();
        };
    </script>
</body>
</html>
